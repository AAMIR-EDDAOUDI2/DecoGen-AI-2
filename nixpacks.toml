providers = ["python", "node"]

[phases.setup]
nixPkgs = ["python311", "nodejs"]

[phases.install]
cmds = [
    "npm install",
    "python -m venv /opt/venv",
    ". /opt/venv/bin/activate && pip install -r requirements.txt"
]

[phases.build]
cmds = [
    "npm run build"
]

[start]
cmd = "gunicorn app:app --bind 0.0.0.0:$PORT"
