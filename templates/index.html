<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>DecoGen AI</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>
  <div class="container">
    <h1>DecoGen AI</h1>
    <p>Upload your room and choose a style.</p>

    <form id="decorate-form" action="{{ url_for('decorate_room_endpoint') }}" method="post" enctype="multipart/form-data">
      <label>Room image</label>
      <input type="file" name="room_image" accept="image/*" required />

      <label>Decoration style</label>
      <textarea name="decoration_prompt" placeholder="Describe your ideal room..." required></textarea>

      <label>Aspect ratio</label>
      <select name="aspect_ratio">
        <option value="16:9">16:9</option>
        <option value="4:3">4:3</option>
        <option value="1:1">1:1</option>
      </select>

      <button type="submit">Transform Room</button>
    </form>

    {% with messages = get_flashed_messages() %}
      {% if messages %}
        <ul class="messages">
          {% for msg in messages %}
            <li>{{ msg }}</li>
          {% endfor %}
        </ul>
      {% endif %}
    {% endwith %}
  </div>
</body>
</html>
